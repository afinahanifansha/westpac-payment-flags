<body>

<aside class="panel">
  <div>
    <h1>Payment flags: clickable demo</h1>
    <p class="note">Concept prototype with made-up data. Tap the phone to move through each flow.</p>
  </div>
  <div>
    <h2>Scenario</h2>
    <div class="scn" id="scnList"></div>
  </div>
  <p class="desc" id="scnDesc"></p>
  <div>
    <h2>Jump to screen</h2>
    <div class="steps-nav" id="stepsNav"></div>
  </div>
  <div id="ctrlBox">
    <h2>Demo controls</h2>
    <div class="ctrl" id="ctrl"></div>
  </div>
  <div>
    <h2>Recording</h2>
    <div class="row-ctl"><span>Size</span><input id="zoom" type="range" min="1" max="1.6" step="0.05" value="1.25"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="big-btn" style="flex:1" id="recBtn">Recording mode</button>
      <button class="ghost-btn" id="resetBtn">Reset</button>
    </div>
    <p class="note">Recording mode hides this panel. <kbd>Esc</kbd> toggles it, <kbd>R</kbd> resets the scenario, <kbd>1</kbd>-<kbd>5</kbd> switch scenarios.</p>
  </div>
</aside>

<main class="stage" id="stage"></main>
<div class="rec-hint" id="recHint">Recording mode · Esc to exit</div>

<script>
(function () {
  'use strict';

  // ---------- helpers ----------
  var bars = '<span class="dots"><i class="sig"></i><i class="bat"></i></span>';
  function status(t, style) { return '<div class="status"' + (style ? ' style="' + style + '"' : '') + '><span>' + t + '</span>' + bars + '</div>'; }
  function appbar(t, s, back) {
    return '<div class="appbar">' + (back ? '<button class="back" data-go="' + back + '" aria-label="Back">‹</button>' : '') +
      '<div><div class="t">' + t + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div></div>';
  }
  function ai(who, text, disc) {
    return '<div class="ai"><div class="who">' + who + '</div><p>' + text + '</p>' + (disc ? '<div class="disc">AI summary from your transactions. It can get things wrong.</div>' : '') + '</div>';
  }
  function done(colour, ico, title, lines, btns) {
    return '<div class="body"><div class="done-ico" style="background:' + colour + '">' + ico + '</div>' +
      '<h3 class="center">' + title + '</h3>' + lines.map(function (l) { return '<p class="center sub" style="font-size:12.5px;margin:0">' + l + '</p>'; }).join('') +
      '<div class="btns">' + btns + '</div></div>';
  }
  function lockScreen(time, date, notifs) {
    return '<div class="view lock">' + status(time, 'color:#fff') +
      '<div class="clock">' + time + '</div><div class="date">' + date + '</div>' + notifs +
      '<div class="hint">Tap a notification to open it</div></div>';
  }
  function notif(go, src, when, title, text) {
    return '<button class="notif" data-go="' + go + '"><div class="src">' + src + ' <span>' + when + '</span></div><b>' + title + '</b><br>' + text + '</button>';

  // ---------- state ----------
  var S = {};
  var toastTimer = null;

  // ---------- scenarios ----------
  var SC = {

    if (e.key === 'Escape') setRec(!document.body.classList.contains('rec'));
    else if (e.key === 'r' || e.key === 'R') start(S.scn);
    else if (/^[1-5]$/.test(e.key)) start(ORDER[+e.key - 1]);
  });

  var q = new URLSearchParams(location.search);
  start(SC[q.get('s')] ? q.get('s') : 'maya');
  if (q.has('rec')) setRec(true);
})();
</script>
